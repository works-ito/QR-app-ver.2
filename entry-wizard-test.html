<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>QR在庫管理｜入口ウィザード試作</title>

  <style>
    :root {
      --blue:#1677ff;
      --blue-dark:#075fc9;
      --blue-pale:#eef6ff;
      --green:#159447;
      --green-pale:#edf9f1;
      --amber:#d88b00;
      --amber-pale:#fff7e6;
      --red:#d73535;
      --ink:#172033;
      --muted:#667085;
      --line:#d9e0ea;
      --surface:#ffffff;
      --background:#f3f6fa;
      --shadow:0 8px 24px rgba(34, 51, 84, 0.10);
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      min-height:100%;
      background:var(--background);
      color:var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }

    button {
      font:inherit;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }

    .app {
      width:100%;
      max-width:430px;
      min-height:100dvh;
      margin:0 auto;
      padding:
        max(12px, env(safe-area-inset-top))
        12px
        max(16px, env(safe-area-inset-bottom));
      background:var(--background);
    }

    .appHeader {
      display:flex;
      align-items:center;
      justify-content:space-between;
      min-height:44px;
      margin-bottom:8px;
    }

    .brand {
      line-height:1.1;
    }

    .brandTitle {
      font-size:20px;
      font-weight:800;
      letter-spacing:0.02em;
    }

    .brandSub {
      margin-top:3px;
      color:var(--muted);
      font-size:11px;
      font-weight:700;
      letter-spacing:0.12em;
    }

    .restartButton {
      min-width:68px;
      min-height:40px;
      padding:8px 12px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
      color:#475467;
      font-size:14px;
      font-weight:700;
    }

    .progress {
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:6px;
      margin:0 0 10px;
    }

    .progressStep {
      height:5px;
      border-radius:999px;
      background:#d7dde7;
      transition:background 0.2s ease;
    }

    .progressStep.isDone {
      background:var(--blue);
    }

    .selectionSummary {
      display:flex;
      gap:6px;
      min-height:31px;
      margin-bottom:10px;
      overflow-x:auto;
      scrollbar-width:none;
    }

    .selectionSummary::-webkit-scrollbar {
      display:none;
    }

    .summaryChip {
      flex:0 0 auto;
      padding:6px 9px;
      border:1px solid #c8ddfa;
      border-radius:999px;
      background:var(--blue-pale);
      color:#145aa8;
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }

    .summaryPlaceholder {
      padding:6px 2px;
      color:#8a94a6;
      font-size:13px;
      font-weight:700;
    }

    .panel {
      display:none;
      padding:16px 14px 14px;
      border:1px solid #e1e6ee;
      border-radius:16px;
      background:var(--surface);
      box-shadow:var(--shadow);
    }

    .panel.isActive {
      display:block;
      animation:panelIn 0.16s ease-out;
    }

    @keyframes panelIn {
      from {
        opacity:0;
        transform:translateY(5px);
      }

      to {
        opacity:1;
        transform:translateY(0);
      }
    }

    .stepLabel {
      margin-bottom:4px;
      color:var(--blue);
      font-size:13px;
      font-weight:800;
    }

    .question {
      margin:0;
      font-size:23px;
      line-height:1.3;
      font-weight:900;
      letter-spacing:-0.01em;
    }

    .questionHint {
      margin:6px 0 14px;
      color:var(--muted);
      font-size:14px;
      line-height:1.45;
      font-weight:600;
    }

    .buttonGrid {
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:9px;
    }

    .choiceButton {
      min-width:0;
      min-height:60px;
      padding:9px 6px;
      border:2px solid #bdd4f2;
      border-radius:12px;
      background:#f8fbff;
      color:#153c68;
      font-size:20px;
      line-height:1.2;
      font-weight:900;
      box-shadow:0 2px 0 rgba(30, 87, 148, 0.08);
    }

    .choiceButton:active {
      transform:translateY(1px);
      background:#e8f2ff;
    }

    .choiceButton[data-kind="danger"] {
      border-color:#efc4c4;
      background:#fff8f8;
      color:#a62d2d;
    }

    .choiceButton[data-kind="special"] {
      border-color:#e6c98e;
      background:#fffaf0;
      color:#865700;
    }

    .singleColumn {
      grid-template-columns:1fr;
    }

    .singleColumn .choiceButton {
      min-height:66px;
      font-size:22px;
    }

    .backButton {
      width:100%;
      min-height:48px;
      margin-top:12px;
      border:1px solid var(--line);
      border-radius:11px;
      background:#f5f6f8;
      color:#4c5668;
      font-size:17px;
      font-weight:800;
    }

    .dateBox {
      margin-top:12px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#f8fafc;
    }

    .dateLabel {
      display:block;
      margin-bottom:6px;
      font-size:15px;
      font-weight:800;
    }

    .dateInput {
      width:100%;
      min-height:54px;
      padding:8px 10px;
      border:2px solid #b8c4d4;
      border-radius:10px;
      background:#fff;
      color:var(--ink);
      font-size:20px;
      font-weight:700;
    }

    .nextButton {
      width:100%;
      min-height:60px;
      margin-top:12px;
      border:0;
      border-radius:12px;
      background:var(--blue);
      color:#fff;
      font-size:21px;
      font-weight:900;
      box-shadow:0 4px 10px rgba(22, 119, 255, 0.24);
    }

    .nextButton:active {
      background:var(--blue-dark);
    }

    .completeCard {
      padding:14px;
      border:2px solid #b9e2c7;
      border-radius:14px;
      background:var(--green-pale);
    }

    .completeTitle {
      margin:0 0 10px;
      color:var(--green);
      font-size:24px;
      font-weight:900;
      text-align:center;
    }

    .completeList {
      display:grid;
      grid-template-columns:92px 1fr;
      gap:8px 10px;
      margin:0;
      font-size:17px;
      line-height:1.4;
    }

    .completeList dt {
      color:#526073;
      font-weight:700;
    }

    .completeList dd {
      margin:0;
      font-weight:900;
      word-break:break-word;
    }

    .cameraPreview {
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:150px;
      margin-top:12px;
      padding:16px;
      border:3px dashed #9fb8d8;
      border-radius:14px;
      background:#eef4fb;
      color:#436184;
      text-align:center;
      font-size:18px;
      line-height:1.5;
      font-weight:900;
    }

    .connectionNote {
      margin:10px 2px 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
      font-weight:600;
      text-align:center;
    }

    .debugOutput {
      margin-top:12px;
      padding:10px;
      border-radius:10px;
      background:#182230;
      color:#d7f7df;
      font-size:12px;
      line-height:1.45;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .hidden {
      display:none !important;
    }

    @media (max-width:360px) {
      .app {
        padding-left:9px;
        padding-right:9px;
      }

      .panel {
        padding:14px 11px 12px;
      }

      .question {
        font-size:21px;
      }

      .choiceButton {
        min-height:57px;
        font-size:18px;
      }
    }

    @media (min-width:431px) {
      .app {
        border-left:1px solid #e1e6ee;
        border-right:1px solid #e1e6ee;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="appHeader">
      <div class="brand">
        <div class="brandTitle">QR在庫管理</div>
        <div class="brandSub">WORKS Co., Ltd.</div>
      </div>

      <button
        id="restartButton"
        class="restartButton"
        type="button"
      >
        最初から
      </button>
    </header>

    <div
      id="progress"
      class="progress"
      aria-label="設定の進行状況"
    >
      <div class="progressStep"></div>
      <div class="progressStep"></div>
      <div class="progressStep"></div>
      <div class="progressStep"></div>
    </div>

    <div
      id="selectionSummary"
      class="selectionSummary"
      aria-live="polite"
    ></div>

    <section
      id="modeStep"
      class="panel"
      aria-labelledby="modeQuestion"
    >
      <div class="stepLabel">STEP 1</div>
      <h1
        id="modeQuestion"
        class="question"
      >
        作業区分を選んでください
      </h1>
      <p class="questionHint">
        今から行う作業を1つ選択します
      </p>

      <div
        id="modeButtons"
        class="buttonGrid"
      ></div>
    </section>

    <section
      id="locationStep"
      class="panel"
      aria-labelledby="locationQuestion"
    >
      <div class="stepLabel">STEP 2</div>
      <h1
        id="locationQuestion"
        class="question"
      >
        実施拠点を選んでください
      </h1>
      <p class="questionHint">
        作業を実施している拠点を選択します
      </p>

      <div
        id="locationButtons"
        class="buttonGrid singleColumn"
      ></div>

      <button
        class="backButton"
        type="button"
        data-back="mode"
      >
        戻る
      </button>
    </section>

    <section
      id="userStep"
      class="panel"
      aria-labelledby="userQuestion"
    >
      <div class="stepLabel">STEP 3</div>
      <h1
        id="userQuestion"
        class="question"
      >
        担当者を選んでください
      </h1>
      <p class="questionHint">
        今回の作業者を選択します
      </p>

      <div
        id="userButtons"
        class="buttonGrid"
      ></div>

      <button
        class="backButton"
        type="button"
        data-back="location"
      >
        戻る
      </button>
    </section>

    <section
      id="returnMethodStep"
      class="panel"
      aria-labelledby="returnMethodQuestion"
    >
      <div class="stepLabel">追加設定</div>
      <h1
        id="returnMethodQuestion"
        class="question"
      >
        返却方法を選んでください
      </h1>
      <p class="questionHint">
        QRを読み取れるかどうかを選択します
      </p>

      <div class="buttonGrid singleColumn">
        <button
          class="choiceButton"
          type="button"
          data-return-method="QRあり"
        >
          QRあり返却
        </button>

        <button
          class="choiceButton"
          type="button"
          data-return-method="QRなし"
          data-kind="special"
        >
          QRなし返却
        </button>
      </div>

      <button
        class="backButton"
        type="button"
        data-back="user"
      >
        戻る
      </button>
    </section>

    <section
      id="recStep"
      class="panel"
      aria-labelledby="recQuestion"
    >
      <div class="stepLabel">追加設定</div>
      <h1
        id="recQuestion"
        class="question"
      >
        REC対象を選んでください
      </h1>
      <p class="questionHint">
        対象を選び、必要な場合は実施日を入力します
      </p>

      <div
        id="recTargetButtons"
        class="buttonGrid"
      ></div>

      <div
        id="recDateBox"
        class="dateBox hidden"
      >
        <label
          id="recDateLabel"
          class="dateLabel"
          for="recDate"
        >
          実施日
        </label>

        <input
          id="recDate"
          class="dateInput"
          type="date"
        >

        <button
          id="confirmRecButton"
          class="nextButton"
          type="button"
        >
          この内容で次へ
        </button>
      </div>

      <button
        class="backButton"
        type="button"
        data-back="user"
      >
        戻る
      </button>
    </section>

    <section
      id="completeStep"
      class="panel"
      aria-labelledby="completeTitle"
    >
      <div class="completeCard">
        <h1
          id="completeTitle"
          class="completeTitle"
        >
          設定完了
        </h1>

        <dl
          id="completeList"
          class="completeList"
        ></dl>
      </div>

      <div
        id="cameraPreview"
        class="cameraPreview"
      >
        カメラ接続前の試作です
      </div>

      <p
        id="connectionNote"
        class="connectionNote"
      >
        本番接続時は、この画面に到達した直後にカメラを自動起動します。
      </p>

      <pre
        id="debugOutput"
        class="debugOutput"
      ></pre>

      <button
        class="backButton"
        type="button"
        data-back="last"
      >
        設定を修正する
      </button>
    </section>
  </main>

  <script>
    const MODE_OPTIONS = [
      { value:"出庫", label:"出庫" },
      { value:"返却", label:"返却" },
      { value:"完成機", label:"完成機" },
      { value:"修理中", label:"修理" },
      { value:"拠点移動", label:"拠点移動" },
      { value:"出庫取消", label:"出庫取消" },
      { value:"校正中", label:"校正中", kind:"special" },
      { value:"校正完了", label:"校正完了", kind:"special" },
      { value:"交換完了", label:"交換完了", kind:"special" },
      { value:"入庫", label:"入庫" },
      { value:"廃棄", label:"廃棄", kind:"danger" }
    ];

    const LOCATION_OPTIONS = [
      "本社",
      "三郷",
      "MF"
    ];

    const USER_OPTIONS = [
      "奥",
      "滝島",
      "上野",
      "見﨑",
      "田之岡",
      "篠塚",
      "その他"
    ];

    const REC_TARGET_OPTIONS = [
      "騒音計",
      "振動計",
      "内部USB"
    ];

    const REC_MODES = [
      "校正中",
      "校正完了",
      "交換完了"
    ];

    const REC_DATE_REQUIRED_MODES = [
      "校正完了",
      "交換完了"
    ];

    const STEP_IDS = {
      mode:"modeStep",
      location:"locationStep",
      user:"userStep",
      returnMethod:"returnMethodStep",
      rec:"recStep",
      complete:"completeStep"
    };

    const wizardState = {
      mode:"",
      modeLabel:"",
      location:"",
      user:"",
      returnQrMode:"",
      recTarget:"",
      recDate:"",
      lastInputStep:"user"
    };

    function createChoiceButton(options) {
      const data = options || {};
      const button = document.createElement("button");

      button.type = "button";
      button.className = "choiceButton";
      button.innerText = data.label || data.value || "";

      if (data.kind) {
        button.dataset.kind = data.kind;
      }

      button.addEventListener("click", function() {
        if (typeof data.onClick === "function") {
          data.onClick();
        }
      });

      return button;
    }

    function renderButtons() {
      const modeButtons =
        document.getElementById("modeButtons");

      MODE_OPTIONS.forEach(function(item) {
        modeButtons.appendChild(
          createChoiceButton({
            label:item.label,
            value:item.value,
            kind:item.kind,
            onClick:function() {
              selectMode(item);
            }
          })
        );
      });

      const locationButtons =
        document.getElementById("locationButtons");

      LOCATION_OPTIONS.forEach(function(location) {
        locationButtons.appendChild(
          createChoiceButton({
            label:location,
            value:location,
            onClick:function() {
              selectLocation(location);
            }
          })
        );
      });

      const userButtons =
        document.getElementById("userButtons");

      USER_OPTIONS.forEach(function(user) {
        userButtons.appendChild(
          createChoiceButton({
            label:user,
            value:user,
            onClick:function() {
              selectUser(user);
            }
          })
        );
      });

      const recTargetButtons =
        document.getElementById("recTargetButtons");

      REC_TARGET_OPTIONS.forEach(function(target) {
        recTargetButtons.appendChild(
          createChoiceButton({
            label:target,
            value:target,
            kind:"special",
            onClick:function() {
              selectRecTarget(target);
            }
          })
        );
      });
    }

    function showStep(stepName) {
      Object.keys(STEP_IDS).forEach(function(name) {
        const panel =
          document.getElementById(STEP_IDS[name]);

        panel.classList.toggle(
          "isActive",
          name === stepName
        );
      });

      updateProgress(stepName);
      updateSummary();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });
    }

    function updateProgress(stepName) {
      const progressIndex = {
        mode:0,
        location:1,
        user:2,
        returnMethod:3,
        rec:3,
        complete:4
      }[stepName] || 0;

      document
        .querySelectorAll(".progressStep")
        .forEach(function(step, index) {
          step.classList.toggle(
            "isDone",
            index < progressIndex
          );
        });
    }

    function updateSummary() {
      const summary =
        document.getElementById("selectionSummary");

      const values = [];

      if (wizardState.modeLabel) {
        values.push(wizardState.modeLabel);
      }

      if (wizardState.location) {
        values.push(wizardState.location);
      }

      if (wizardState.user) {
        values.push(wizardState.user);
      }

      summary.innerHTML = "";

      if (values.length === 0) {
        const placeholder =
          document.createElement("div");

        placeholder.className =
          "summaryPlaceholder";

        placeholder.innerText =
          "設定内容がここに表示されます";

        summary.appendChild(placeholder);
        return;
      }

      values.forEach(function(value) {
        const chip =
          document.createElement("div");

        chip.className = "summaryChip";
        chip.innerText = value;
        summary.appendChild(chip);
      });
    }

    function selectMode(item) {
      wizardState.mode = item.value;
      wizardState.modeLabel = item.label;

      wizardState.location = "";
      wizardState.user = "";
      wizardState.returnQrMode = "";
      wizardState.recTarget = "";
      wizardState.recDate = "";

      showStep("location");
    }

    function selectLocation(location) {
      wizardState.location = location;
      wizardState.user = "";
      wizardState.returnQrMode = "";
      wizardState.recTarget = "";
      wizardState.recDate = "";

      showStep("user");
    }

    function selectUser(user) {
      wizardState.user = user;

      if (wizardState.mode === "返却") {
        wizardState.lastInputStep =
          "returnMethod";

        showStep("returnMethod");
        return;
      }

      if (REC_MODES.includes(wizardState.mode)) {
        wizardState.lastInputStep = "rec";
        prepareRecStep();
        showStep("rec");
        return;
      }

      wizardState.lastInputStep = "user";
      finishWizard();
    }

    function prepareRecStep() {
      wizardState.recTarget = "";
      wizardState.recDate = "";

      document.getElementById(
        "recDate"
      ).value = "";

      document.getElementById(
        "recDateBox"
      ).classList.add("hidden");
    }

    function selectRecTarget(target) {
      wizardState.recTarget = target;

      if (
        REC_DATE_REQUIRED_MODES.includes(
          wizardState.mode
        )
      ) {
        const dateBox =
          document.getElementById("recDateBox");

        const dateLabel =
          document.getElementById("recDateLabel");

        dateLabel.innerText =
          wizardState.mode === "交換完了"
            ? "交換実施日"
            : "校正実施日";

        dateBox.classList.remove("hidden");

        document.getElementById(
          "recDate"
        ).focus();

        return;
      }

      wizardState.recDate = "";
      finishWizard();
    }

    function confirmRecSettings() {
      const dateValue =
        document.getElementById("recDate").value;

      if (!wizardState.recTarget) {
        alert("REC対象を選んでください");
        return;
      }

      if (
        REC_DATE_REQUIRED_MODES.includes(
          wizardState.mode
        ) &&
        !dateValue
      ) {
        alert("実施日を入力してください");
        return;
      }

      wizardState.recDate = dateValue;
      finishWizard();
    }

    function selectReturnMethod(method) {
      wizardState.returnQrMode = method;
      finishWizard();
    }

    function buildWizardSettings() {
      return {
        mode:wizardState.mode,
        location:wizardState.location,
        user:wizardState.user,
        returnQrMode:
          wizardState.returnQrMode,
        recTarget:
          wizardState.recTarget,
        recDate:
          wizardState.recDate
      };
    }

    function finishWizard() {
      const settings =
        buildWizardSettings();

      renderCompleteSettings(settings);
      showStep("complete");
      completeEntryWizard(settings);
    }

    function renderCompleteSettings(settings) {
      const list =
        document.getElementById("completeList");

      const rows = [
        ["作業区分", wizardState.modeLabel],
        ["実施拠点", settings.location],
        ["担当者", settings.user]
      ];

      if (settings.returnQrMode) {
        rows.push([
          "返却方法",
          settings.returnQrMode
        ]);
      }

      if (settings.recTarget) {
        rows.push([
          "REC対象",
          settings.recTarget
        ]);
      }

      if (settings.recDate) {
        rows.push([
          "実施日",
          settings.recDate
        ]);
      }

      list.innerHTML = "";

      rows.forEach(function(row) {
        const term =
          document.createElement("dt");

        const description =
          document.createElement("dd");

        term.innerText = row[0];
        description.innerText = row[1];

        list.appendChild(term);
        list.appendChild(description);
      });

      const cameraPreview =
        document.getElementById("cameraPreview");

      const connectionNote =
        document.getElementById("connectionNote");

      if (
        settings.mode === "返却" &&
        settings.returnQrMode === "QRなし"
      ) {
        cameraPreview.innerText =
          "QRなし返却フローへの接続位置";

        connectionNote.innerText =
          "本番接続時はカメラを起動せず、QRなし返却の写真・追記画面へ進みます。";

      } else {
        cameraPreview.innerText =
          "カメラ自動起動の接続位置\nQRを読み取ってください";

        connectionNote.innerText =
          "本番接続時は、この画面に到達した直後にカメラを自動起動します。";
      }

      document.getElementById(
        "debugOutput"
      ).innerText =
        JSON.stringify(settings, null, 2);
    }

    /*
     * =====================================================
     * 既存QR在庫管理アプリとの接続口
     * =====================================================
     *
     * この試作では既存アプリへ接続しない。
     *
     * 本番移植時に、この関数内で次を行う。
     *
     * ・既存のmode / location / userへ値を渡す
     * ・returnQrMode / recTarget / recDateへ値を渡す
     * ・管理区分制限を設定する
     * ・設定を端末へ保存する
     * ・通常ルートならカメラを自動起動する
     * ・QRなし返却なら専用フローへ進む
     */
    function completeEntryWizard(settings) {
      console.log(
        "入口ウィザード設定完了",
        settings
      );
    }

    function goBack(target) {
      if (target === "mode") {
        showStep("mode");
        return;
      }

      if (target === "location") {
        showStep("location");
        return;
      }

      if (target === "user") {
        showStep("user");
        return;
      }

      if (target === "last") {
        showStep(
          wizardState.lastInputStep ||
          "user"
        );
      }
    }

    function resetWizard() {
      wizardState.mode = "";
      wizardState.modeLabel = "";
      wizardState.location = "";
      wizardState.user = "";
      wizardState.returnQrMode = "";
      wizardState.recTarget = "";
      wizardState.recDate = "";
      wizardState.lastInputStep = "user";

      document.getElementById(
        "recDate"
      ).value = "";

      document.getElementById(
        "recDateBox"
      ).classList.add("hidden");

      showStep("mode");
    }

    document
      .querySelectorAll("[data-return-method]")
      .forEach(function(button) {
        button.addEventListener(
          "click",
          function() {
            selectReturnMethod(
              button.dataset.returnMethod
            );
          }
        );
      });

    document
      .querySelectorAll("[data-back]")
      .forEach(function(button) {
        button.addEventListener(
          "click",
          function() {
            goBack(button.dataset.back);
          }
        );
      });

    document
      .getElementById("confirmRecButton")
      .addEventListener(
        "click",
        confirmRecSettings
      );

    document
      .getElementById("restartButton")
      .addEventListener(
        "click",
        resetWizard
      );

    renderButtons();
    resetWizard();
  </script>
</body>
</html>
