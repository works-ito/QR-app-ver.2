name: Temporary inventory status refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-inventory-status-refactor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply inventory status refactor
        run: python .github/scripts/temp_inventory_status_refactor.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js manual-refresh-ui-dev.js sales-stockin.js
          git commit -m "Centralize inventory status UI ownership"
          git push origin main
