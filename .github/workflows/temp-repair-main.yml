name: Temporary repair main
on:
  push:
    paths:
      - '.github/workflows/temp-repair-main.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index from known good commit and keep diagnostics v3
        run: |
          git checkout 297d494ff7bb4f3f60bf7084401b662aec4f8bde -- index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="./inventory-fetch-diagnostics.js?v=2"></script>'
          new='<script src="./inventory-fetch-diagnostics.js?v=3"></script>'
          if s.count(old) != 1:
              raise SystemExit(f'diagnostics loader mismatch: {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check inventory-fetch-diagnostics.js
          git diff --check
          test "$(wc -l < index.html)" -gt 1200
          grep -F 'inventory-fetch-diagnostics.js?v=3' index.html
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore complete index and load diagnostics v3'
          git push origin HEAD:main
