name: One-time sync development to production

on:
  push:
    paths:
      - '.github/workflows/sync-development-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone development baseline
        run: git clone --depth 1 https://github.com/works-ito/QR-app-development.git /tmp/QR-app-development

      - name: Replace production contents
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/QR-app-development/. .
          rm -rf .git
          git checkout -- .git 2>/dev/null || true

      - name: Commit and push synchronized contents
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to sync.'
            exit 0
          fi
          git commit -m 'Sync production with QR-app-development main'
          git push origin HEAD:main
