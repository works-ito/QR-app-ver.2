name: Temporary version path audit
on:
  push:
    paths:
      - '.github/workflows/temp-version-path-audit.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show version-check path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text()
          keys=['function reloadAppWithCacheBust','async function checkAppVersion','function startAppVersionCheckTimer','startAppVersionCheckTimer();','initializeInventoryDataFoundation();']
          lines=s.splitlines()
          for key in keys:
              print('\n###', key)
              hits=[i for i,l in enumerate(lines) if key in l]
              print('hits', [i+1 for i in hits])
              for i in hits:
                  a=max(0,i-8); b=min(len(lines),i+45)
                  for n in range(a,b): print(f'{n+1}: {lines[n]}')
                  print('---')
          print('\n### version.json')
          print(Path('version.json').read_text())
          PY
