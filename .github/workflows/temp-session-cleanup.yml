name: Temporary session cleanup
on:
  push:
    paths:
      - '.github/workflows/temp-session-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor session finish safely
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text()
          old = '''    async function resumeWizardContinuousScan(message) {
      wizardPostSendContext = null;
      wizardSelectedPhotos = [];
      wizardCurrentSlipInfo = null;
      wizardPendingPhotoSave = null;
      /*
       * 写真・追記の完了後も、直前送信の取消期限内は
       * post-send領域を取消ボタンの置き場として残す。
       */
      const cancelStillValid =
        Boolean(lastSuccessfulSend) &&
        Number(lastSuccessfulSend.expiresAt || 0) > Date.now();
      document.getElementById("wizardPostSendArea").hidden =
        !cancelStillValid;
      document.getElementById("wizardRecMemoArea").hidden = true;
      document.getElementById("wizardPhotoArea").hidden = true;
      document.getElementById("wizardPhotoTitleArea").hidden = true;
      scannerBusy = false;
      setTemporaryScannerStatus(message || "完了 ✔\\n続けてQRを読み取れます", 1400);
      if (!scannerRunning) await startReadOnlyScanner();
    }
'''
          new = '''    async function resumeWizardContinuousScan(message) {
      const shouldFinishSession =
        typeof window.shouldFinishWizardSession === "function" &&
        window.shouldFinishWizardSession({
          message:message,
          remainingCount:Array.isArray(scannedEntries) ? scannedEntries.length : 0
        });

      if (shouldFinishSession) {
        if (typeof stopReadOnlyScanner === "function") {
          await stopReadOnlyScanner();
        }
        resetWizard();
        if (typeof window.finishWizardSessionView === "function") {
          window.finishWizardSessionView();
        }
        return;
      }

      wizardPostSendContext = null;
      wizardSelectedPhotos = [];
      wizardCurrentSlipInfo = null;
      wizardPendingPhotoSave = null;
      /*
       * 写真・追記の完了後も、直前送信の取消期限内は
       * post-send領域を取消ボタンの置き場として残す。
       */
      const cancelStillValid =
        Boolean(lastSuccessfulSend) &&
        Number(lastSuccessfulSend.expiresAt || 0) > Date.now();
      document.getElementById("wizardPostSendArea").hidden =
        !cancelStillValid;
      document.getElementById("wizardRecMemoArea").hidden = true;
      document.getElementById("wizardPhotoArea").hidden = true;
      document.getElementById("wizardPhotoTitleArea").hidden = true;
      scannerBusy = false;
      setTemporaryScannerStatus(message || "完了 ✔\\n続けてQRを読み取れます", 1400);
      if (!scannerRunning) await startReadOnlyScanner();
    }
'''
          if text.count(old) != 1:
              raise SystemExit(f'app target count={text.count(old)}')
          text = text.replace(old, new)
          app.write_text(text)

          Path('wizard-session.js').write_text('''/* 受付セッション制御 v1\n * 1受付=1セッションの終了判定と、終了後の表示整理を担当する。\n * app.js の関数差し替え・wrapperは行わない。\n */\n(function() {\n  "use strict";\n\n  function shouldFinishWizardSession(context) {\n    const data = context || {};\n    const message = String(data.message || "");\n    const remainingCount = Number(data.remainingCount || 0);\n\n    if (message.includes("取消完了")) return false;\n    if (remainingCount > 0) return false;\n    return true;\n  }\n\n  function clearStaleWizardSendStatus() {\n    const status = document.getElementById("wizardSendStatus");\n    if (!status) return;\n\n    if (\n      typeof wizardSendResultUnknown !== "undefined" &&\n      wizardSendResultUnknown === true\n    ) return;\n\n    if (typeof stopAnimatedDots === "function") {\n      stopAnimatedDots("wizardSendStatus");\n    }\n\n    status.innerText = "";\n    status.className = "wizardSendStatus";\n  }\n\n  function finishWizardSessionView() {\n    const pickerPanel = document.getElementById("irregularMasterPickerPanel");\n    if (pickerPanel) pickerPanel.hidden = true;\n\n    const pickerRoot = document.getElementById("irregularMasterPickerDev");\n    if (pickerRoot) {\n      pickerRoot.querySelectorAll(".irregularMasterStep").forEach(function(step) {\n        step.hidden = true;\n      });\n    }\n\n    clearStaleWizardSendStatus();\n\n    try {\n      window.scrollTo({top:0, behavior:"smooth"});\n    } catch (error) {}\n  }\n\n  window.shouldFinishWizardSession = shouldFinishWizardSession;\n  window.finishWizardSessionView = finishWizardSessionView;\n})();\n''')

          sales = Path('sales-stockin.js')
          s = sales.read_text()
          if s.count('/* 販売品入庫受付 v154 bootstrap */') != 1:
              raise SystemExit('sales bootstrap version mismatch')
          if s.count('.then(function() { return loadScript("./wizard-session-finish-dev.js?v=104"); })') != 1:
              raise SystemExit('old session loader missing')
          s = s.replace('/* 販売品入庫受付 v154 bootstrap */', '/* 販売品入庫受付 v155 bootstrap */')
          s = s.replace('.then(function() { return loadScript("./wizard-session-finish-dev.js?v=104"); })', '.then(function() { return loadScript("./wizard-session.js?v=1"); })')
          sales.write_text(s)

          idx = Path('index.html')
          i = idx.read_text()
          if i.count('./app.js?v=83') != 1 or i.count('./sales-stockin.js?v=154') != 1:
              raise SystemExit('index cache version mismatch')
          i = i.replace('./app.js?v=83', './app.js?v=84')
          i = i.replace('./sales-stockin.js?v=154', './sales-stockin.js?v=155')
          idx.write_text(i)

          old_dev = Path('wizard-session-finish-dev.js')
          if not old_dev.exists():
              raise SystemExit('old dev file missing')
          old_dev.unlink()

          # Safety assertions: no old wrapper remains, new formal calls exist exactly once.
          final_app = app.read_text()
          if 'installContinuousScanPatch' in final_app:
              raise SystemExit('unexpected old patch symbol in app')
          if final_app.count('window.shouldFinishWizardSession') != 2:
              raise SystemExit('session decision references unexpected')
          if final_app.count('window.finishWizardSessionView') != 2:
              raise SystemExit('session view references unexpected')
          if 'wizard-session-finish-dev.js' in sales.read_text():
              raise SystemExit('old session loader remains')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js wizard-session.js sales-stockin.js index.html wizard-session-finish-dev.js
          git commit -m "refactor: formalize wizard session finish"
          git push
