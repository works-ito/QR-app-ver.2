name: Patch irregular step2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-irregular-step2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove legacy irregular DOM only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          choice_start_marker = '      <div class="wizardRadioGrid">\n        <label><input type="radio" name="wizardIrregularNumberType" value="入力" checked>番号を入力する</label>'
          note_marker = '      <label for="wizardIrregularNote">状況・理由</label>'
          choice_start = text.find(choice_start_marker)
          note_start = text.find(note_marker, choice_start)

          if choice_start == -1 or note_start == -1 or note_start <= choice_start:
              raise SystemExit('Legacy irregular choice block markers not found; aborting without changes.')
          if text.find(choice_start_marker, choice_start + 1) != -1:
              raise SystemExit('Multiple legacy irregular choice blocks found; aborting.')

          text = text[:choice_start] + text[note_start:]

          quantity_start_marker = '      <div id="wizardIrregularQuantityBox" hidden>'
          check_marker = '      <div id="wizardIrregularCheckResult" class="wizardPostSummary"></div>'
          quantity_start = text.find(quantity_start_marker)
          check_start = text.find(check_marker, quantity_start)

          if quantity_start == -1 or check_start == -1 or check_start <= quantity_start:
              raise SystemExit('Legacy irregular quantity block markers not found; aborting without changes.')
          if text.find(quantity_start_marker, quantity_start + 1) != -1:
              raise SystemExit('Multiple legacy irregular quantity blocks found; aborting.')

          new_text = text[:quantity_start] + text[check_start:]

          if new_text == index.read_text(encoding='utf-8'):
              raise SystemExit('No index.html change produced; aborting.')

          index.write_text(new_text, encoding='utf-8')
          PY

      - name: Verify focused diff
        run: |
          git diff --check
          git diff -- index.html

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Remove legacy irregular choice DOM'
          git push origin HEAD:main
