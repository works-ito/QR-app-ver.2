name: Patch irregular step2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-irregular-step2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch openWizardIrregularArea only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')

          start_marker = '    function openWizardIrregularArea() {'
          end_marker = '    function updateWizardIrregularNumberType() {'

          start = text.find(start_marker)
          end = text.find(end_marker, start)

          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Target function markers not found; aborting without changes.')

          if text.find(start_marker, start + 1) != -1:
              raise SystemExit('Multiple openWizardIrregularArea functions found; aborting.')

          replacement = '''    function openWizardIrregularArea() {
      wizardIrregularRecord = null;
      wizardIrregularDetected = null;
      document.getElementById("wizardPostSendArea").hidden = false;
      document.getElementById("wizardIrregularArea").hidden = false;
      document.getElementById("wizardIrregularNote").value = "";
      document.getElementById("wizardIrregularCheckResult").innerText = "";
      scrollToWizardPostSend("wizardIrregularArea");
    }

'''

          new_text = text[:start] + replacement + text[end:]

          if new_text == text:
              raise SystemExit('No app.js change produced; aborting.')

          app.write_text(new_text, encoding='utf-8')

          index = Path('index.html')
          index_text = index.read_text(encoding='utf-8')
          old = './app.js?v=69'
          new = './app.js?v=70'
          if index_text.count(old) != 1:
              raise SystemExit(f'Expected exactly one {old}; found {index_text.count(old)}. Aborting.')
          index.write_text(index_text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify focused diff
        run: |
          git diff --check
          git diff -- app.js index.html

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Remove obsolete irregular field initialization'
          git push origin HEAD:main
