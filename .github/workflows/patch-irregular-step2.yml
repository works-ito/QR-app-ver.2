name: Patch master host separation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-irregular-step2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run focused patch
        run: python3 scripts/patch_master_host_step.py
      - name: Verify diff
        run: |
          git diff --check
          git diff -- index.html normal-master-entry-test-dev.js sales-stockin.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html normal-master-entry-test-dev.js sales-stockin.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Separate master picker from irregular host"
          git push origin HEAD:main
