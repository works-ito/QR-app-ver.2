# trigger: 2026-08-27-0650
name: Patch master route separation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-irregular-step2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run focused patch
        run: python3 scripts/patch_master_route_separation.py
      - name: Verify
        run: |
          git diff --check
          git diff -- app.js index.html
          grep -F 'settings.receptionType ===' app.js >/dev/null
          grep -F '"irregular"' app.js >/dev/null
          grep -F './app.js?v=72' index.html >/dev/null
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Separate master completion route from irregular'
          git push origin HEAD:main
