name: Patch sales loader cache key

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-irregular-step2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump loader
        run: sed -i 's#./sales-stockin.js?v=121#./sales-stockin.js?v=146#' index.html
      - name: Verify
        run: |
          grep -F './sales-stockin.js?v=146' index.html
          git diff --check
          git diff -- index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump sales-stockin loader cache key'
          git push origin HEAD:main
