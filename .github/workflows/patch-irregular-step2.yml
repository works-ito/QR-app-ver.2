name: Patch irregular step2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-irregular-step2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove legacy irregular DOM only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          legacy_choices = '''      <div class="wizardRadioGrid">
        <label><input type="radio" name="wizardIrregularNumberType" value="入力" checked>番号を入力する</label>
        <label><input type="radio" name="wizardIrregularNumberType" value="番号不明">番号が読めない</label>
      </div>
      <label for="wizardIrregularNumber">管理番号または品目コード</label>
      <input id="wizardIrregularNumber" type="text" autocomplete="off" placeholder="管理番号または品目コードを入力">
      <div class="wizardRadioGrid">
        <label><input type="radio" name="wizardIrregularSlipStatus" value="伝票あり" checked>伝票あり</label>
        <label><input type="radio" name="wizardIrregularSlipStatus" value="伝票なし">伝票なし</label>
      </div>
      <div id="wizardIrregularSlipGuide" class="wizardPostSummary">1枚目に伝票写真を追加してください。</div>
'''

          legacy_quantity = '''      <div id="wizardIrregularQuantityBox" hidden>
        <label for="wizardIrregularQuantity">数量</label>
        <input id="wizardIrregularQuantity" type="number" inputmode="numeric" min="1" step="1" placeholder="数量">
        <div id="wizardIrregularQuantityUnit" class="wizardPostSummary"></div>
      </div>
'''

          if text.count(legacy_choices) != 1:
              raise SystemExit(f'Expected exactly one legacy choice block; found {text.count(legacy_choices)}. Aborting.')
          if text.count(legacy_quantity) != 1:
              raise SystemExit(f'Expected exactly one legacy quantity block; found {text.count(legacy_quantity)}. Aborting.')

          new_text = text.replace(legacy_choices, '', 1)
          new_text = new_text.replace(legacy_quantity, '', 1)

          if new_text == text:
              raise SystemExit('No index.html change produced; aborting.')

          index.write_text(new_text, encoding='utf-8')
          PY

      - name: Verify focused diff
        run: |
          git diff --check
          git diff -- index.html

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Remove legacy irregular choice DOM'
          git push origin HEAD:main
