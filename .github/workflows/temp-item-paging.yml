name: Temporary item paging patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-item-paging.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply item paging patch
        run: python .github/scripts/temp_item_paging.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add irregular-master-picker-dev.js index.html sales-stockin.js
          git commit -m "Paginate irregular item list at 20 per page"
          git push origin main
