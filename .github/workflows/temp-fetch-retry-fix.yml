name: Temporary app cache bump
on:
  push:
    paths:
      - '.github/workflows/temp-fetch-retry-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify retry patch and bump app cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('app.js').read_text()
          for target in ['action:"getCurrentStateData"', 'action:"getAppInitialData"']:
              pos = app.index(target)
              if app.rfind('response = await fetchWithRetry(', max(0, pos - 1200), pos) < 0:
                  raise SystemExit(f'retry patch missing near {target}')
          p = Path('index.html')
          s = p.read_text()
          old = '<script src="./app.js?v=84"></script>'
          new = '<script src="./app.js?v=85"></script>'
          if s.count(old) != 1:
              raise SystemExit(f'expected one app v84 loader, found {s.count(old)}')
          s = s.replace(old, new, 1)
          if s.count(new) != 1:
              raise SystemExit('app v85 loader assertion failed')
          p.write_text(s)
          PY
          git diff --check
          git diff -- index.html
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: bump app cache after inventory retry fix'
          git push origin HEAD:main
