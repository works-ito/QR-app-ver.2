name: Temporary Actions health check

on:
  push:
    paths:
      - '.github/workflows/temp-actions-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository checkout
        run: |
          test -f app.js
          test -f wizard-session-finish-dev.js
          test -f sales-stockin.js
          echo "Actions health check OK"
