name: Temporary diagnostics v4
on:
  push:
    paths:
      - '.github/workflows/temp-diagnostics-v4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch diagnostics display only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('inventory-fetch-diagnostics.js')
          s=p.read_text()
          old='''  function showDiagnostics() {\n    const entries = readEntries();\n    const text = entries.length\n      ? entries.map(formatEntry).join("\\n")\n      : "診断ログはまだありません";\n    alert("在庫通信診断（保存上限50イベント）\\n\\n" + text);\n  }'''
          new='''  function showDiagnostics() {\n    const entries = readEntries();\n    const latestEntries = entries.slice(-20).reverse();\n    const text = latestEntries.length\n      ? latestEntries.map(formatEntry).join("\\n")\n      : "診断ログはまだありません";\n    alert("在庫通信診断（最新20件 / 保存上限50件）\\n\\n" + text);\n  }'''
          if s.count(old) != 1:
              raise SystemExit(f'showDiagnostics block mismatch: {s.count(old)}')
          s=s.replace(old,new,1)
          s=s.replace('在庫通信診断 v3（一時調査用）','在庫通信診断 v4（一時調査用）',1)
          s=s.replace('在庫通信診断 v3 読込完了','在庫通信診断 v4 読込完了',1)
          p.write_text(s)

          ip=Path('index.html')
          t=ip.read_text()
          old_loader='<script src="./inventory-fetch-diagnostics.js?v=3"></script>'
          new_loader='<script src="./inventory-fetch-diagnostics.js?v=4"></script>'
          if t.count(old_loader) != 1:
              raise SystemExit(f'loader mismatch: {t.count(old_loader)}')
          ip.write_text(t.replace(old_loader,new_loader,1))
          PY
          node --check inventory-fetch-diagnostics.js
          git diff --check
          test "$(wc -l < index.html)" -gt 1200
          grep -F 'inventory-fetch-diagnostics.js?v=4' index.html
          git diff --stat
      - name: Commit diagnostics v4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory-fetch-diagnostics.js index.html
          git commit -m 'chore: show newest inventory diagnostics first'
          git push origin HEAD:main
