name: Temporary parallel startup patch

on:
  push:
    paths:
      - '.github/workflows/temp-parallel-startup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch startup flow
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          app_path = Path('app.js')
          text = app_path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'    async function initializeInventoryDataFoundation\(\) \{.*?\n    \}\n\n    /\*\n     \* 初期データ取得中にウィザードを完了した場合も、',
              re.S,
          )

          replacement = '''    async function initializeInventoryDataFoundation() {
      const cache =
        await restoreInventoryCache();

      if (cache) {
        emitInventoryDataStatusEvent("loading");

        /*
         * 起動高速化：
         * 軽量な現在状態取得と全体同期を同時に開始する。
         *
         * ① 現在状態が先に完了した時点で受付を開始可能にする。
         * ② 全体同期はバックグラウンドで継続する。
         * ③ ①と②の両方が終わった後、現在状態だけを再取得し、
         *    全体同期完了時の状態上書きを防いで最終状態を最新化する。
         */
        const currentStatePromise =
          loadCurrentStateData();

        const fullDataPromise =
          loadAppInitialData(false);

        const currentStateReady =
          await currentStatePromise;

        if (currentStateReady) {
          startScannerAfterInventoryReady();
        } else {
          const fullDataReady =
            await fullDataPromise;

          if (fullDataReady) {
            startScannerAfterInventoryReady();
          }
        }

        void (async function() {
          try {
            const fullDataReady =
              await fullDataPromise;

            /*
             * 初回の現在状態取得がまだ終わっている最中に
             * ③を開始すると currentStateDataLoading で弾かれるため、
             * 必ず①の終了も待つ。
             */
            await currentStatePromise;

            if (!fullDataReady) {
              return;
            }

            const finalStateReady =
              await loadCurrentStateData();

            if (finalStateReady) {
              startScannerAfterInventoryReady();
            }
          } catch (error) {
            console.warn(
              "起動後の最終現在状態更新に失敗",
              error
            );
          }
        })();

        return;
      }

      /*
       * 初回端末などキャッシュが存在しない場合は、
       * 現在状態だけでは機種名・管理区分等が不足するため
       * 従来どおり全体同期を待ってから使用可能にする。
       */
      await loadAppInitialData(true);
      startScannerAfterInventoryReady();
    }

    /*
     * 初期データ取得中にウィザードを完了した場合も,'''

          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'initializeInventoryDataFoundation replacement count={count}')

          app_path.write_text(new_text, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old = '<script src="./app.js?v=81"></script>'
          new = '<script src="./app.js?v=82"></script>'
          if index.count(old) != 1:
              raise SystemExit(f'app.js cache tag count={index.count(old)}')
          index_path.write_text(index.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git diff --cached --check
          git commit -m "feat: run startup inventory refreshes in parallel"
          git push
