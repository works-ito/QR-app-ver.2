name: Sync refactor snapshot to ver.2.2

on:
  push:
    branches:
      - ver-2.2-release-20260823

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'Sync refactor snapshot to ver.2.2'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ver-2.2-release-20260823
          fetch-depth: 0

      - name: Fetch refactor snapshot
        run: |
          rm -rf /tmp/qr-refactor
          git clone --depth 1 https://github.com/works-ito/QR-app-refactor-test.git /tmp/qr-refactor

      - name: Sync snapshot
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            /tmp/qr-refactor/ ./

          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('QR在庫管理・開発版', 'QR在庫管理 ver.2.2')
          text = text.replace('QR在庫管理｜開発版', 'QR在庫管理｜ver.2.2')
          index.write_text(text, encoding='utf-8')

          Path('version.json').write_text(
              '{"version":"2.2-20260823"}\n',
              encoding='utf-8'
          )
          PY

      - name: Commit synced snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Sync refactor snapshot to ver.2.2'
          git push origin HEAD:ver-2.2-release-20260823
