name: Temporary diagnostics loader bump
on:
  push:
    paths:
      - '.github/workflows/temp-diagnostics-loader.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify diagnostics and bump loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          diag = Path('inventory-fetch-diagnostics.js').read_text()
          sales = Path('sales-stockin.js').read_text()
          index = Path('index.html')
          s = index.read_text()
          assert 'const TAP_COUNT = 3;' in diag
          assert 'loadScript("./inventory-fetch-diagnostics.js?v=1")' in sales
          assert '/* 販売品入庫受付 v156 bootstrap */' in sales
          old = '<script src="./sales-stockin.js?v=155"></script>'
          new = '<script src="./sales-stockin.js?v=156"></script>'
          if s.count(old) != 1:
              raise SystemExit(f'expected one v155 loader, found {s.count(old)}')
          index.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- index.html
      - name: Commit loader bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: activate temporary inventory diagnostics'
          git push origin HEAD:main
