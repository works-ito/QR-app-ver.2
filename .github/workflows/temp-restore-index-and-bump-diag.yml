name: Temporary restore index and diagnostics v3
on:
  push:
    paths:
      - '.github/workflows/temp-restore-index-and-bump-diag.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 297d494ff7bb4f3f60bf7084401b662aec4f8bde
      - name: Restore index and bump diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="./inventory-fetch-diagnostics.js?v=2"></script>'
          new='<script src="./inventory-fetch-diagnostics.js?v=3"></script>'
          if s.count(old) != 1:
              raise SystemExit(f'diagnostics loader mismatch: {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          grep -F 'inventory-fetch-diagnostics.js?v=3' index.html
      - name: Commit restored index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore index and load diagnostics v3'
          git push --force-with-lease origin HEAD:main
