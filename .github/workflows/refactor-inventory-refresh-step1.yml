name: Refactor inventory refresh step1

on:
  push:
    paths:
      - '.github/workflows/refactor-inventory-refresh-step1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch inventory refresh ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          s = app.read_text(encoding='utf-8')

          old = '''    let pendingAutoReload = false;\n    let lastHiddenTime = null;\n    const animatedDotsTimers = new Map();'''
          new = '''    let pendingAutoReload = false;\n    let lastHiddenTime = null;\n    let pendingInventoryRefresh = false;\n    let lastInventoryRefreshAt = 0;\n    const animatedDotsTimers = new Map();'''
          if old not in s:
              raise SystemExit('app globals target not found')
          s = s.replace(old, new, 1)

          old = '''        emitInventoryDataStatusEvent(\n          "ready",\n          {updatedAt:cache.updatedAt}\n        );\n\n        return true;'''
          new = '''        emitInventoryDataStatusEvent(\n          "ready",\n          {updatedAt:cache.updatedAt}\n        );\n\n        lastInventoryRefreshAt = Date.now();\n        pendingInventoryRefresh = false;\n\n        return true;'''
          if old not in s:
              raise SystemExit('loadAppInitialData success target not found')
          s = s.replace(old, new, 1)
          app.write_text(s, encoding='utf-8')

          dev = Path('inventory-refresh-control-dev.js')
          d = dev.read_text(encoding='utf-8')
          d = d.replace('  let pendingInventoryRefresh = false;\n  let lastInventoryRefreshAt = 0;\n', '', 1)

          start = d.find('  function markRefreshSuccess() {')
          end = d.find('  async function requestInventoryRefresh(reason) {')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('wrapper block target not found')
          d = d[:start] + d[end:]

          d = d.replace('''    if (success) {\n      markRefreshSuccess();\n      console.log("在庫データ自動更新完了", reason || "", new Date().toLocaleString());\n      return true;\n    }''', '''    if (success) {\n      console.log("在庫データ自動更新完了", reason || "", new Date().toLocaleString());\n      return true;\n    }''', 1)

          d = d.replace('''    if (!installLoadAppInitialDataTracking()) {\n      setTimeout(installLoadAppInitialDataTracking, 500);\n    }\n\n    if (\n      typeof appInitialDataLoaded !== "undefined" &&\n      appInitialDataLoaded === true\n    ) {\n      lastInventoryRefreshAt = Date.now();\n    }\n\n''', '', 1)

          d = d.replace('在庫データ自動更新制御 v89', '在庫データ自動更新制御 v90', 1)
          d = d.replace('開発版：在庫データ自動更新制御 v89 読込完了', '開発版：在庫データ自動更新制御 v90 読込完了', 1)
          dev.write_text(d, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js inventory-refresh-control-dev.js
          git diff --cached --quiet && exit 0
          git commit -m "Move inventory refresh tracking into app core"
          git push
