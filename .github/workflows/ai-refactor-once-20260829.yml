name: AI refactor once

on:
  push:
    branches:
      - main
    paths:
      - scripts/patch_ai_refactor_once.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run focused AI refactor patch
        run: python3 scripts/patch_ai_refactor_once.py
      - name: Verify diff
        run: |
          git diff --check
          grep -n '3.5 Flash-Lite 全体1回' app.js
          ! grep -q 'gemini-whole-image-dev.js?v=80' sales-stockin.js
          grep -n 'gemini-timing-dev.js?v=77' sales-stockin.js
          grep -n 'app.js?v=77' index.html
          grep -n 'sales-stockin.js?v=148' index.html
          grep -n '2.2-20260829-ai-single1' version.json
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js sales-stockin.js index.html version.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Refactor Gemini slip analysis into app core'
          git push origin HEAD:main
