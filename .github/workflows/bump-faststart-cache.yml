name: Bump fast-start cache versions

on:
  push:
    paths:
      - '.github/workflows/bump-faststart-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update cache versions
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          assert './app.js?v=72' in text
          text = text.replace('./app.js?v=72', './app.js?v=73', 1)
          if './manual-refresh-ui-dev.js?v=101' in text:
              text = text.replace('./manual-refresh-ui-dev.js?v=101', './manual-refresh-ui-dev.js?v=103', 1)
          index.write_text(text, encoding='utf-8')

          version = Path('version.json')
          version.write_text('{"version":"2.2-20260828-faststart1"}\n', encoding='utf-8')
          PY

      - name: Commit and cleanup workflow
        shell: bash
        run: |
          rm -f .github/workflows/bump-faststart-cache.yml
          git config user.name "openai-chatgpt"
          git config user.email "openai-chatgpt@users.noreply.github.com"
          git add index.html version.json .github/workflows/bump-faststart-cache.yml
          git commit -m "Bump cache versions for fast startup"
          git push origin main
