name: Apply orphan reception cancel cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-remove-orphan-reception-cancel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove orphan reception cancel DOM
        run: python scripts/patch_remove_orphan_reception_cancel_once.py
      - name: Validate
        run: |
          ! grep -q 'receptionLastSendCancelButton' index.html
          grep -q 'wizardPostSendCancelButton' index.html
          grep -q 'cancelQuantityButton' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Remove orphan reception cancel DOM"
          git push
