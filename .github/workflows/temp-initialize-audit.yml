name: Temporary initialize path audit
on:
  push:
    paths:
      - '.github/workflows/temp-initialize-audit.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show initialize path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text()
          lines=s.splitlines()
          keys=['async function initializeInventoryDataFoundation','async function loadCurrentStateData','async function loadAppInitialData','async function fetchWithRetry','loadCurrentStateData();','loadAppInitialData(false);','loadAppInitialData(true);']
          for key in keys:
              print('\n###', key)
              hits=[i for i,l in enumerate(lines) if key in l]
              print('hits', [i+1 for i in hits])
              for i in hits:
                  a=max(0,i-25); b=min(len(lines),i+120)
                  for n in range(a,b): print(f'{n+1}: {lines[n]}')
                  print('---')
          PY
