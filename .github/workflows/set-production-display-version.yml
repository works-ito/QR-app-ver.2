name: Set production display version

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-production-display-version.yml'

permissions:
  contents: write

jobs:
  update-display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Change only visible app title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'QR在庫管理・開発版'
          new = 'QR在庫管理 ver.2.1'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one visible title, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/set-production-display-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/set-production-display-version.yml
          git commit -m "Change visible app title to QR在庫管理 ver.2.1"
          git push origin main
