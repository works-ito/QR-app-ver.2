name: Bump sales loader to v149 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-sales-loader-v149-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump loader cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = './sales-stockin.js?v=148'
          new = './sales-stockin.js?v=149'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one {old}; found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'Bump sales loader cache key to v149'
          git push origin HEAD:main
