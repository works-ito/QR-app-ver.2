name: Apply AI retry consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ai-retry-consolidation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/patch_ai_retry_consolidation_once.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scanner-try-harder-dev.js index.html version.json
          git diff --cached --check
          git commit -m "Consolidate AI slip analysis retry"
          git push
