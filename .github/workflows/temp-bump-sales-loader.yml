name: temp bump sales loader
on:
  push:
    paths:
      - '.github/workflows/temp-bump-sales-loader.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index loader only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<script src="./sales-stockin.js?v=159"></script>'
          new = '<script src="./sales-stockin.js?v=161"></script>'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old loader, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: load inventory refresh controller'
          git push