name: One-time checkout cancel state hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hotfix-checkout-cancel-state.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app.js safely
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_app.py
          python3 /tmp/patch_app.py

      - name: Syntax check
        run: node --check app.js

      - name: Commit hotfix and remove one-time workflow
        run: |
          rm .github/workflows/hotfix-checkout-cancel-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/hotfix-checkout-cancel-state.yml
          git commit -m "Fix checkout cancel state validation"
          git push origin HEAD:main
