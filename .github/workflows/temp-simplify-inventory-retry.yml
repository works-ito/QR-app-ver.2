name: temp simplify inventory retry
on:
  push:
    paths:
      - '.github/workflows/temp-simplify-inventory-retry.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show retry call sites
        run: |
          grep -n -B 8 -A 12 'fetchWithRetry(' app.js
          grep -n -B 4 -A 8 'attempt <= 2;' app.js