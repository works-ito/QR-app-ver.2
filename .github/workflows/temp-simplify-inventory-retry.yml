name: temp simplify inventory retry
on:
  push:
    paths:
      - '.github/workflows/temp-simplify-inventory-retry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify inventory retry to one layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app.js')
          s = p.read_text()
          state_pattern = re.compile(r'        for \(\n          let attempt = 1;\n          attempt <= 2;\n          attempt\+\+\n        \) \{\n          response = await fetchWithRetry\(\n            GAS_URL \+\n              "\?t=" \+ Date\.now\(\) \+\n              "&stateAttempt=" \+ attempt,\n(?P<body>.*?)\n          \);\n\n          responseText =\n            await response\.text\(\);\n\n          if \(response\.ok\) break;\n\n          if \(attempt === 1\) \{\n            await new Promise\(\n              function\(resolve\) \{\n                setTimeout\(resolve, 700\);\n              \}\n            \);\n          \}\n        \}', re.S)
          full_pattern = re.compile(r'        for \(\n          let attempt = 1;\n          attempt <= 2;\n          attempt\+\+\n        \) \{\n          response = await fetchWithRetry\(\n            GAS_URL \+\n              "\?t=" \+ Date\.now\(\) \+\n              "&attempt=" \+ attempt,\n(?P<body>.*?)\n          \);\n\n          responseText =\n            await response\.text\(\);\n\n          if \(response\.ok\) break;\n\n          if \(attempt === 1\) \{\n            await new Promise\(\n              function\(resolve\) \{\n                setTimeout\(resolve, 1000\);\n              \}\n            \);\n          \}\n        \}', re.S)
          sm = state_pattern.search(s)
          fm = full_pattern.search(s)
          if not sm: raise SystemExit('current-state retry block not found')
          if not fm: raise SystemExit('full-sync retry block not found')
          state_new = '        response = await fetchWithRetry(\n          GAS_URL +\n            "?t=" + Date.now() +\n            "&stateRequest=1",\n' + sm.group('body').replace('            {', '          {', 1) + '\n        );\n\n        responseText =\n          await response.text();'
          full_new = '        response = await fetchWithRetry(\n          GAS_URL +\n            "?t=" + Date.now() +\n            "&fullRequest=1",\n' + fm.group('body').replace('            {', '          {', 1) + '\n        );\n\n        responseText =\n          await response.text();'
          s, n1 = state_pattern.subn(lambda m: state_new, s, count=1)
          s, n2 = full_pattern.subn(lambda m: full_new, s, count=1)
          if (n1, n2) != (1, 1): raise SystemExit(f'replacement mismatch {n1}, {n2}')
          if 'attempt <= 2;' in s: raise SystemExit('outer inventory retry remains')
          p.write_text(s)
          index = Path('index.html')
          h = index.read_text()
          old = '<script src="./app.js?v=85"></script>'
          new = '<script src="./app.js?v=86"></script>'
          if h.count(old) != 1: raise SystemExit(f'app loader mismatch {h.count(old)}')
          index.write_text(h.replace(old, new, 1))
          PY
      - name: Verify and commit
        run: |
          git diff --check
          grep -n -B 2 -A 18 'stateRequest=1' app.js
          grep -n -B 2 -A 24 'fullRequest=1' app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'refactor: use one retry layer for inventory fetches'
          git push