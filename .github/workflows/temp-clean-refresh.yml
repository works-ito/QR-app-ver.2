name: Temporary refresh cleanup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-clean-refresh.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete 15-minute refresh and bump cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.js')
          s = p.read_text()
          replacements = [
              (r'^\s*const DATA_REFRESH_MINUTES = 15;\n', '', 1, 'DATA_REFRESH_MINUTES'),
              (r'^\s*let inventoryRefreshTimer = null;\n', '', 1, 'inventoryRefreshTimer'),
              (r'\nasync function runScheduledInventoryRefresh\(\) \{.*?\n\}\n\nfunction startInventoryRefreshTimer\(\) \{.*?\n\}\n\n(?=function startAppVersionCheckTimer\(\))', '\n', 1, 'legacy refresh functions'),
              (r'^startInventoryRefreshTimer\(\);\n', '', 1, 'startup timer call'),
          ]
          for pattern, repl, expected, label in replacements:
              flags = re.M | (re.S if label == 'legacy refresh functions' else 0)
              s, n = re.subn(pattern, repl, s, count=expected, flags=flags)
              if n != expected:
                  raise SystemExit(f'{label}: expected {expected} replacement, got {n}')
          for forbidden in ['DATA_REFRESH_MINUTES', 'inventoryRefreshTimer', 'runScheduledInventoryRefresh', 'startInventoryRefreshTimer']:
              if forbidden in s:
                  raise SystemExit(f'obsolete symbol remains: {forbidden}')
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          s, n1 = re.subn(r'\./app\.js\?v=82', './app.js?v=83', s, count=1)
          s, n2 = re.subn(r'\./sales-stockin\.js\?v=152', './sales-stockin.js?v=154', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'cache bump count app={n1} sales={n2}')
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html
          git diff --cached --check
          git commit -m "refactor: remove obsolete scheduled inventory refresh"
          git push
