name: Patch fast-start ready status

on:
  push:
    paths:
      - '.github/workflows/patch-faststart-ready.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch ready timing
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')

          old = '''        buildAppInitialDataMaps();\n        currentStateDataLoaded = true;\n        renderCancelSendButton();\n\n        void saveInventoryCache()'''
          new = '''        buildAppInitialDataMaps();\n        currentStateDataLoaded = true;\n        renderCancelSendButton();\n\n        emitInventoryDataStatusEvent(\n          "ready",\n          {\n            updatedAt:\n              result.fetchedAt ||\n              new Date().toISOString()\n          }\n        );\n\n        void saveInventoryCache()'''

          assert text.count(old) == 1, f'app ready insertion match count={text.count(old)}'
          text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_index = '<script src="./app.js?v=73"></script>'
          new_index = '<script src="./app.js?v=74"></script>'
          assert html.count(old_index) == 1, f'index app version match count={html.count(old_index)}'
          html = html.replace(old_index, new_index, 1)
          index.write_text(html, encoding='utf-8')

          version = Path('version.json')
          version.write_text('{"version":"2.2-20260828-faststart2"}\n', encoding='utf-8')
          PY

          node --check app.js

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-faststart-ready.yml
          git config user.name "openai-chatgpt"
          git config user.email "openai-chatgpt@users.noreply.github.com"
          git add app.js index.html version.json .github/workflows/patch-faststart-ready.yml
          git commit -m "Show ready when current state is loaded"
          git push origin main
