name: Apply client send timing instrumentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-send-timing-instrumentation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply timing instrumentation
        run: python scripts/patch_send_timing_instrumentation_once.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          grep -q '送信計測：準備' app.js
          grep -q './app.js?v=80' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html version.json
          git diff --cached --check
          git commit -m "Add client send timing instrumentation"
          git push
